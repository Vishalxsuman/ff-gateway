name: Deploy FF Gateway to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ${{ secrets.ACR_REGISTRY }}   # e.g. myregistry.azurecr.io
  IMAGE_NAME: ff-gateway
  APP_NAME: ${{ secrets.AZURE_APP_NAME }}

jobs:
  # ── 1. Test ────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          FF_GUEST_UID: "1948201948"
          FF_GUEST_PASSWORD: "ci_placeholder"
          FF_OB_VERSION: "OB55"
          AES_KEY: "Yg&tc%DEuh6%Zc^8"
          AES_IV: "6oyZDr22E3ychjM%"
          ENABLE_CACHE: "false"
          ENABLE_RATE_LIMIT: "false"
          LOG_LEVEL: "WARNING"
        run: |
          pytest tests/ --cov=src --cov-report=term-missing --cov-fail-under=50 -v

  # ── 2. Build & Push Docker image ───────────────────────────────────────────
  build-and-push:
    name: Build & Push to ACR
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set image tags
        id: meta
        run: |
          SHA="${GITHUB_SHA::8}"
          echo "sha_tag=$SHA" >> "$GITHUB_OUTPUT"
          echo "full_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.full_image }}:latest
            ${{ steps.meta.outputs.full_image }}:${{ steps.meta.outputs.sha_tag }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.full_image }}:latest
          cache-to: type=inline

  # ── 3. Deploy to Azure App Service ────────────────────────────────────────
  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production

    steps:
      - name: Deploy container to App Service
        run: |
          USER_NAME=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | grep -o 'userName="[^"]*"' | head -1 | cut -d'"' -f2)
          USER_PWD=$(echo '${{ secrets.AZURE_CREDENTIALS }}' | grep -o 'userPWD="[^"]*"' | head -1 | cut -d'"' -f2)
          APP_HOST="${{ env.APP_NAME }}.scm.azurewebsites.net"
          
          echo "Triggering Azure Container Deployment for ${{ env.APP_NAME }}..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -u "$USER_NAME:$USER_PWD" -X POST "https://$APP_HOST/api/container/deploy")
          echo "Container deployment trigger returned HTTP $STATUS"

      - name: Verify health endpoint
        run: |
          sleep 30
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://${{ env.APP_NAME }}.azurewebsites.net/health)
          echo "Health endpoint returned: $STATUS"
          [ "$STATUS" = "200" ] || [ "$STATUS" = "503" ] || exit 1
